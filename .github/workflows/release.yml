name: Release

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Run all gates and npm publish dry-run without publishing
        required: true
        type: boolean
        default: true

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: commerce-tssdk
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          path: commerce-tssdk
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: Niyantra-Labs/commerce
          token: ${{ secrets.COMMERCE_REPO_TOKEN }}
          path: commerce
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
          cache: npm
          cache-dependency-path: commerce-tssdk/package-lock.json
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.1.26'
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: '2.1.4'
      - run: npm ci
      - run: npm run build
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run fmt:check
      - run: npm test
      - run: npm run coverage
      - run: npm run docs
      - run: npm run contract:check
      - run: docker compose -f integration/compose.yml up -d --build
      - name: Wait for Commerce health
        run: |
          for attempt in $(seq 1 90); do
            if curl --fail --silent http://127.0.0.1:19094/health > /dev/null; then exit 0; fi
            sleep 2
          done
          docker compose -f integration/compose.yml logs app
          exit 1
      - run: npm run test:integration
      - run: npm run test:runtimes
      - run: npm run test:package
      - run: npm audit --omit=dev
      - name: Verify package contents
        run: |
          npm pack --dry-run --json > /tmp/commerce-release-pack.json
          node --input-type=module -e '
            import { readFileSync } from "node:fs";
            const report = JSON.parse(readFileSync("/tmp/commerce-release-pack.json", "utf8"));
            const pack = Array.isArray(report) ? report[0] : Object.values(report)[0];
            if (!pack || !Array.isArray(pack.files)) throw new Error("Missing npm pack file list");
            const unexpected = pack.files.map(file => file.path).filter(path =>
              !path.startsWith("dist/") && !["LICENSE", "README.md", "package.json"].includes(path));
            if (unexpected.length) throw new Error(`Unexpected package files: ${unexpected.join(", ")}`);
          '
      - name: Dry-run the packed artifact
        run: |
          release_tmp=$(mktemp -d)
          tarball=$(npm pack --pack-destination "$release_tmp" --silent)
          tar -xzf "$release_tmp/$tarball" -C "$release_tmp"
          cd "$release_tmp/package"
          npm pkg delete private
          npm publish --dry-run --provenance
      - name: Check publish token
        id: publish_token
        if: inputs.dry_run == false
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NPM_TOKEN" ]; then
            echo 'NPM_TOKEN is required for a real release' >&2
            exit 1
          fi
          echo 'available=true' >> "$GITHUB_OUTPUT"
      - name: Publish with provenance
        if: inputs.dry_run == false && steps.publish_token.outputs.available == 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --provenance --access public
